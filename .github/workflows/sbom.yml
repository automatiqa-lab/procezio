name: SBOM

# Generate a CycloneDX software bill of materials from the pnpm lockfile (Syft handles
# pnpm), so security-conscious adopters can audit the full dependency set. Runs on a
# tagged release and on demand; the SBOM is attached as a build artifact and, on a
# release, to the release itself.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Generate CycloneDX SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          format: cyclonedx-json
          output-file: procezio-sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: procezio-sbom
          path: procezio-sbom.cdx.json

      - name: Attach SBOM to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: procezio-sbom.cdx.json
