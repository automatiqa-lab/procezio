name: SBOM

# Generate a CycloneDX software bill of materials from the pnpm lockfile (Syft handles
# pnpm), so security-conscious adopters can audit the full dependency set. On demand:
# the SBOM comes out as a build artifact for auditing between releases.
#
# Release SBOMs are NOT produced here. A `release: published` trigger would never fire,
# because releases are created by an action using the default GITHUB_TOKEN and GitHub
# does not raise workflow events from those. release.yml builds and attaches it instead.
on:
  workflow_dispatch:

jobs:
  sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Generate CycloneDX SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          format: cyclonedx-json
          output-file: procezio-sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: procezio-sbom
          path: procezio-sbom.cdx.json

