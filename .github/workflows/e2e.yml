name: E2E

# Playwright smoke + privacy tests against the real production build. Separate from the main
# CI gate suite because it downloads a browser (~120 MB) - kept off the fast per-commit path,
# run on pushes and PRs to main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Enable pnpm via corepack
        run: corepack enable

      - name: Install (frozen lockfile)
        run: corepack pnpm install --frozen-lockfile

      - name: Build the core package (the app bundle resolves @procezio/core from its dist)
        run: corepack pnpm --filter @procezio/core run build

      - name: Install Playwright Chromium
        run: corepack pnpm run e2e:install

      - name: Run E2E (builds + previews the real bundle)
        run: corepack pnpm run e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
