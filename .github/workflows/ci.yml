name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  dod:
    name: Definition of Done
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Enable pnpm via corepack
        run: corepack enable

      - name: Install (frozen lockfile)
        run: corepack pnpm install --frozen-lockfile

      # Fast early signal.
      - name: Typecheck
        run: corepack pnpm run ci:typecheck

      # The whole Definition of Done in one step, so CI can never drift out of sync
      # with the local `ci:all` list: adding a gate to package.json's ci:all runs it
      # here automatically. The step log names the gate command that failed. ci:all
      # chains: license, schema/validators/ruleset/prompt-pack drift, rule fixtures,
      # replay determinism, Solo security scan, then the full acceptance test suite.
      - name: Definition of Done (full gate suite)
        run: corepack pnpm run ci:all
