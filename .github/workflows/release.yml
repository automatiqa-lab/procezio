name: Release

# Push a tag like v0.5.0 to cut a release: CI's Definition of Done runs, the static app is
# built, and the bundle plus a CycloneDX SBOM are attached to a GitHub release.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Enable pnpm via corepack
        run: corepack enable

      - name: Install (frozen lockfile)
        run: corepack pnpm install --frozen-lockfile

      - name: Definition of Done (full gate suite)
        run: corepack pnpm run ci:all

      - name: Build the Solo app
        run: corepack pnpm --filter @procezio/app run build

      - name: Package the static build
        run: tar -czf procezio-solo-${{ github.ref_name }}.tar.gz -C app/dist .

      # Generated here rather than in a workflow listening for `release: published`:
      # GitHub does not fire workflows from events raised with the default GITHUB_TOKEN,
      # so that listener never runs and the SBOM never reaches the release.
      - name: Generate CycloneDX SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          format: cyclonedx-json
          output-file: procezio-sbom-${{ github.ref_name }}.cdx.json

      - name: Create the release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            procezio-solo-${{ github.ref_name }}.tar.gz
            procezio-sbom-${{ github.ref_name }}.cdx.json
